name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y shellcheck tmux

      - name: shellcheck
        run: shellcheck bin/em-*.sh bin/lib/*.sh tests/run.sh

      - name: tests
        run: bash tests/run.sh
        env:
          TERM: xterm-256color
